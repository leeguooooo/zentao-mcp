name: windows-smoke

# #1: on Windows every command died with
#   Assertion failed: !(handle->flags & UV_HANDLE_CLOSING), file src\win\async.c
# because index.js called process.exit() synchronously while libuv handles were
# still closing. There is no Windows machine on the maintainer's side, so this
# runner is the regression guard: a plain --help and an unknown subcommand both
# exercise the exit path end to end, with no ZenTao server involved.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # bash (Git Bash on windows-latest) rather than pwsh: GitHub's pwsh wrapper
      # appends `exit $LASTEXITCODE`, so a step whose LAST native command exits 1
      # on purpose is reported as failed no matter what the script asserted.
      - name: help exits 0 without a libuv assertion
        shell: bash
        run: |
          set +e
          out=$(node src/index.js --help 2>&1); rc=$?
          set -e
          echo "$out" | head -3
          [ "$rc" = "0" ] || { echo "expected exit 0, got $rc"; exit 1; }
          echo "$out" | grep -q "Assertion failed" && { echo "libuv assertion on --help"; exit 1; }
          echo "ok: --help exit 0, no assertion"
      - name: unknown subcommand exits 1, cleanly
        shell: bash
        run: |
          set +e
          out=$(node src/index.js definitely-not-a-command 2>&1); rc=$?
          set -e
          echo "$out"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
          echo "$out" | grep -q "Assertion failed" && { echo "libuv assertion on error path"; exit 1; }
          echo "ok: error path exit 1, no assertion"
      - name: unit tests
        run: node --test
